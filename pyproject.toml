[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "mlflow>=3.0",
    "requests>=2.31",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # Client major version tracks the Kubernetes minor version (cluster: 1.36).
    # 37.x needs python-dateutil>=3, which conflicts with DVC's celery pin.
    "kubernetes>=36,<37",
    "google-genai>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dvc = ["dvc>=3.50"]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx2>=2.16"]

[tool.setuptools.packages.find]
include = ["agent*", "training*", "api*"]

[project.scripts]
mlops-agent = "agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # All raised inside MLflow itself, not by this project.
    "ignore:The ``noload`` loader strategy is deprecated:DeprecationWarning",
    "ignore:Operation with range is deprecated",
    "ignore:codecs.open\\(\\) is deprecated:DeprecationWarning",
    # Refers to the model's integer 0/1 predictions, which never contain missing values.
    "ignore:.*Inferred schema contains integer column:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# The repo's kubernetes/ folder holds manifests; `import kubernetes` is the PyPI client.
known-third-party = ["kubernetes"]
