# Restricted identity for the MLOps agent: read-only access to mlops-app, plus the two
# operations the agent may perform after user confirmation (rollout restart, scale).
# It has no access to any other namespace and cannot create or delete resources.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-agent
  namespace: mlops-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlops-agent
  namespace: mlops-app
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "events", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services/proxy"]          # read the app's /version through the API server
    verbs: ["get"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]                      # rollout restart
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch"]               # scale
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlops-agent
  namespace: mlops-app
subjects:
  - kind: ServiceAccount
    name: mlops-agent
    namespace: mlops-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mlops-agent
