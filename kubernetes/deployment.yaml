apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediction-api
  namespace: mlops-app
  labels:
    app.kubernetes.io/name: prediction-api
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: mlops-agent
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: prediction-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # keep both replicas serving during a rollout
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prediction-api
        app.kubernetes.io/version: "1.0.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prediction-api
          image: prediction-api:1.0.0
          imagePullPolicy: IfNotPresent   # built locally; Docker Desktop shares the image store
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: prediction-api-config
          env:
            - name: APP_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          # Ready only once the model is loaded from MLflow.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          # Alive as long as the process answers; model loading never triggers a restart.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp   # model downloads and HOME
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
